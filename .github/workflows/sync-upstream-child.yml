name: Sync upstream and child branches

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-child-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check and update sync branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Run selective synchronization
        id: sync
        env:
          SYNC_BRANCH: automation/upstream-child-sync
        run: bash scripts/sync-upstream-child.sh

      - name: Create or update sync PR
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          REPORT_FILE: ${{ steps.sync.outputs.report_file }}
        run: |
          set -euo pipefail
          if [[ ! -f "$REPORT_FILE" ]]; then
            echo "sync report is missing: $REPORT_FILE" >&2
            exit 1
          fi
          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --json number \
            --jq '.[0].number')
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sync upstream main and child features" \
              --body-file "$REPORT_FILE"
            echo "updated sync PR #$existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream main and child features" \
              --body-file "$REPORT_FILE"
          fi
